services:

  db:
    image: postgres:17-alpine
    container_name: financas_ibf_db
    restart: always
    env_file:
      - ./backend/.env.confdb
    volumes:
      - financas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: financas_backend
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    restart: always
    networks:
      - app_network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: financas_frontend
    env_file:
      - ./frontend/.env    
    expose:
      - "80"
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  financas_pgdata:

networks:
  app_network:
    external: true
